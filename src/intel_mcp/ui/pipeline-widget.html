  --ta-topbar-height: 80px;
}
.ta-section-label{
  color: var(--ta-muted-foreground);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.intel-app{
  --ta-background: hsl(165 10% 9%);
  --ta-foreground: hsl(150 11% 96%);
  --ta-border: hsl(164 8% 23%);
  --ta-card: hsl(165 9% 14%);
  --ta-card-foreground: hsl(150 11% 96%);
  --ta-card-border: hsl(164 8% 24%);
  --ta-sidebar: hsl(168 13% 5%);
  --ta-sidebar-border: hsl(165 8% 23%);
  --ta-sidebar-accent: hsl(160 12% 16%);
  --ta-secondary: hsl(164 8% 18%);
  --ta-muted: hsl(164 8% 17%);
  --ta-muted-foreground: hsl(164 7% 72%);
  --ta-input: hsl(164 7% 32%);
  --ta-shadow-card: 0 1px 0 hsl(150 12% 32% / 0.08), 0 12px 30px rgb(0 0 0 / 0.16);
  --ta-topbar-height: 72px;
  min-height: 100vh;
  background: var(--ta-background);
  font-size: 16px;
}
.intel-app .ta-section-label{ color: hsl(153 26% 72%); font-size: 12px; font-weight: 600; }
.workspace-header{
  height: var(--ta-topbar-height);
  min-height: var(--ta-topbar-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  padding: 0 32px 0 38px;
  border-bottom: 1px solid var(--ta-border);
  background: hsl(165 10% 11% / 0.97);
  box-shadow: 0 8px 28px rgb(0 0 0 / 0.1);
}
.workspace-title{ display: flex; align-items: center; gap: 14px; }
.workspace-title > button{ width: 28px; height: 28px; border: 0; background: transparent; color: var(--ta-foreground); cursor: pointer; }
.workspace-title .ta-section-label{ margin: 0; line-height: 1; }
.workspace-title h1{ margin: 3px 0 0; font-size: 22px; }
@media (max-width: 760px){.workspace-header{ height: auto; min-height: 100px; padding: 14px 16px; align-items: flex-start; flex-direction: column; }}
.intel-app{
  color-scheme: light;
  --ta-background: hsl(150 10% 97%);
  --ta-foreground: hsl(168 22% 10%);
  --ta-border: hsl(210 13% 88%);
  --ta-card: hsl(0 0% 100%);
  --ta-card-foreground: hsl(168 22% 10%);
  --ta-card-border: hsl(210 13% 88%);
  --ta-sidebar: hsl(168 13% 6%);
  --ta-sidebar-foreground: hsl(0 0% 97%);
  --ta-sidebar-border: hsl(165 8% 18%);
  --ta-sidebar-accent: hsl(164 10% 13%);
  --ta-primary: hsl(151 50% 42%);
  --ta-primary-hover: hsl(151 51% 36%);
  --ta-primary-soft: hsl(151 43% 94%);
  --ta-primary-soft-foreground: hsl(151 51% 28%);
  --ta-secondary: hsl(150 10% 96%);
  --ta-secondary-foreground: hsl(168 22% 12%);
  --ta-muted: hsl(150 10% 96%);
  --ta-muted-foreground: hsl(210 7% 39%);
  --ta-input: hsl(210 12% 76%);
  --ta-radius: 0.75rem;
  --ta-radius-sm: 0.5rem;
  --ta-shadow-card: 0 1px 2px rgb(20 31 27 / 0.04), 0 8px 24px rgb(20 31 27 / 0.045);
  --ta-shadow-floating: 0 14px 34px rgb(20 31 27 / 0.16);
  background: var(--ta-background);
  color: var(--ta-foreground);
}
.intel-app .ta-section-label{ color: hsl(151 47% 32%); font-size: 12px; }
.intel-app .workspace-header{
  min-height: 78px;
  height: 78px;
  border-color: hsl(210 13% 89%);
  background: hsl(0 0% 100% / 0.98);
  box-shadow: none;
}
.intel-app .workspace-title > button{
  display: grid;
  place-items: center;
  border-radius: 7px;
  color: hsl(210 7% 34%);
}
.intel-app .workspace-title > button:hover{ background: hsl(150 10% 95%); color: var(--ta-primary); }
@media (max-width: 760px){.intel-app .workspace-header{ height: auto; min-height: 106px; }}
.root{
  --site-ink: var(--ta-foreground);
  --site-muted: var(--ta-muted-foreground);
  --site-line: var(--ta-border);
  --site-soft: var(--ta-muted);
  --site-green: var(--ta-primary);
  --site-green-soft: var(--ta-primary-soft);
  font-family: var(--ta-font-sans);
  font-size: 16px;
}
.header{ background: rgb(255 255 255 / .98) !important; }
.workspaceTitle{ display: block; margin-top: 3px; color: var(--site-ink); font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -.02em; }
@media (max-width: 760px){.root .workspace-header{ height: auto; min-height: 76px; padding: 13px 14px; gap: 12px; flex-wrap: wrap; }
.workspaceTitle{ max-width: 190px; overflow: hidden; font-size: 18px; text-overflow: ellipsis; white-space: nowrap; }}
@media(min-width:1200px){.intel-workspace-restored:has(.wh-layout) .workspace-header{flex:0 0 var(--ta-topbar-height)}}
@media (max-width: 720px){.combined-workspace .workspace-header{ flex-wrap: wrap; gap: 12px; }}
.combined-preview-label{color:#476450;font-size:12px;font-weight:600;white-space:nowrap;}
@media(max-width:760px){.combined-public-shell .workspace-title>div{min-width:0}
.combined-public-shell .workspaceTitle{max-width:190px}}
.combined-workspace .workspace-header h1{margin-block:4px 0;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.025em;overflow-wrap:anywhere;}
.combined-extension-surface .workspace-header{background:var(--ta-sidebar)!important;border-bottom:1px solid #293b31;padding:20px 24px;}
.combined-extension-surface .workspace-header h1{color:#f2f5f3;margin-top:12px;}
.combined-extension-surface .workspace-header .workspace-title{min-width:0;max-width:100%;}
.combined-extension-surface .workspace-header .workspace-title>div{min-width:0;}
@media(max-width:760px){.combined-extension-surface .workspace-header{padding:18px 16px;}}
.combined-workspace .workspace-header{position:relative;flex:none;z-index:20}
@media(max-width:600px){.combined-workspace .workspace-header{flex-wrap:wrap;gap:12px}
.combined-project-header-actions{margin-left:auto}}
.combined-plugin-shell .workspace-header{height:auto;min-height:76px;padding:18px 24px;gap:16px;flex-wrap:wrap}
.combined-project-header-actions,.workspace-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.intel-research-workspace button,.combined-project-header-actions button{font:inherit;cursor:pointer;border:1px solid var(--ta-border);border-radius:var(--ta-radius-sm);background:var(--ta-card);padding:7px 12px;color:var(--ta-foreground)}
@media(max-width:600px){.combined-plugin-shell .workspace-header,.combined-plugin-shell .combined-public-content{padding:14px}}
/* Intel extension header, from combined-workspace.css. */
.workspace-brand {display:inline-flex;align-items:center;gap:10px;color:#f2f5f3;font:600 17px/28px var(--ta-font-sans);letter-spacing:-.02em;}
.workspace-brand img {display:block;flex:none;object-fit:contain;}
.combined-extension-surface .combined-preview-label {padding:6px 10px;border:1px solid #3c5246;border-radius:999px;background:#1b2e23;color:#d8e6dd;font-size:12px;font-weight:400;}
.combined-extension-surface button.workspace-brand{padding:0;border:0;background:transparent;color:#f2f5f3;cursor:pointer;text-align:left}
.combined-extension-surface button.workspace-brand:focus-visible{outline:2px solid #fff;outline-offset:5px}
