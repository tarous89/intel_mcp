name: Validate and apply Site premium MCP
on:
  push:
    branches: [feature/site-premium-revisions]
    paths: [.github/workflows/site-premium-apply.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hash-checked implementation
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          patch = gzip.decompress(base64.b64decode(Path('.site-premium-patch.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '2ff8b6993e7b6eb69af8de108c0516940671d135da6c1a55517b2e534123cb97'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Commit only validated feature changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .site-premium-patch.b64 .github/workflows/site-premium-apply.yml .github/workflows/site-premium-source-review.yml
          git add src tests PROJECT_CONTEXT.md SITE_AGENT_CONTEXT.md .site-premium-patch.b64 .github/workflows/site-premium-apply.yml .github/workflows/site-premium-source-review.yml
          git diff --cached --check
          git commit -m 'Add strict Site Agent revisions and complete matching lists'
          git push origin HEAD:feature/site-premium-revisions
