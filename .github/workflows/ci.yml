name: MCP CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selection_test
          POSTGRES_PASSWORD: selection_test
          POSTGRES_DB: selection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selection_test -d selection_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_SELECTION_DATABASE_URL: postgresql://selection_test:selection_test@localhost:5432/selection_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/sync_plugin_guidance.py --check
      - run: pytest -q
      - run: python scripts/benchmark_workspace_memory.py

  workspace-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/research/package-lock.json
      - run: npm ci --ignore-scripts --prefix ui/research
      - run: npx --prefix ui/research playwright install --with-deps chromium
      - run: node --test ui/research/workspace-browser.test.mjs ui/research/disclosure-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-design
          path: /tmp/workspace-design/
      - run: node --test ui/research/followups-browser.test.mjs ui/research/connect-project.test.mjs ui/research/workspace-navigation.test.mjs ui/research/workspace-bundle.test.mjs

  live-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed MCP classifier configuration
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --max-time 15 https://intel-mcp.onrender.com/health || true)"
            if python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status")=="ok" and d.get("service")=="intel-mcp" and d.get("classifier_configured") is True' "$body" 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo 'MCP health did not report classifier_configured=true.' >&2
          exit 1

