name: Site premium source review
on:
  push:
    branches: [feature/site-premium-revisions]
    paths: [.github/workflows/site-premium-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: site-premium-source
          path: source.tar.gz
          retention-days: 1
