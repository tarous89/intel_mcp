# Standalone Blueprint; existing App, MCP, Engine and databases are not managed here.
services:
  - type: worker
    name: intel-max-worker
    runtime: docker
    repo: https://github.com/tarous89/intel_mcp
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile.max-worker
    dockerContext: .
    autoDeployTrigger: "off"
    envVars:
      # App MAX_AGENT_ENABLED remains false during deployment validation.
      - key: MAX_AGENT_ENABLED
        value: "true"
      - key: MAX_AGENT_MODEL
        value: gpt-5.6-sol
      - key: MAX_AGENT_TRIAL_LIMIT
        value: "100"
      - key: MAX_AGENT_DISCOVERY_LIMIT
        value: "10000"
      - key: MAX_AGENT_DOCUMENT_LIMIT
        value: "20"
      - key: MAX_AGENT_DOCUMENT_CHARACTERS
        value: "2000000"
      - key: MAX_AGENT_MAX_TURNS
        value: "12"
      - key: MAX_AGENT_MAX_MINUTES
        value: "180"
      - key: MCP_ENGINE_SOURCE
        value: database
      - key: MCP_ENGINE_DATABASE_POOL_SIZE
        value: "2"
      - key: MCP_PUBLIC_RESOURCE_URL
        value: https://mcp.trialagents.com/mcp
      - key: INTEL_APP_CONTROL_URL
        fromService: {name: intel-mcp, type: web, envVarKey: INTEL_APP_CONTROL_URL}
      - key: INTEL_APP_SERVICE_TOKEN
        fromService: {name: intel-mcp, type: web, envVarKey: INTEL_APP_SERVICE_TOKEN}
      - key: INTEL_ENGINE_API_URL
        fromService: {name: intel-mcp, type: web, envVarKey: INTEL_ENGINE_API_URL}
      - key: INTEL_ENGINE_SERVICE_TOKEN
        fromService: {name: intel-mcp, type: web, envVarKey: INTEL_ENGINE_SERVICE_TOKEN}
      - key: OPENAI_API_KEY
        fromService: {name: intel-mcp, type: web, envVarKey: OPENAI_API_KEY}
      - key: MCP_ENGINE_DATABASE_HOST
        fromService: {name: intel-mcp, type: web, envVarKey: MCP_ENGINE_DATABASE_HOST}
      - key: MCP_ENGINE_DATABASE_PORT
        fromService: {name: intel-mcp, type: web, envVarKey: MCP_ENGINE_DATABASE_PORT}
      - key: MCP_ENGINE_DATABASE_NAME
        fromService: {name: intel-mcp, type: web, envVarKey: MCP_ENGINE_DATABASE_NAME}
      - key: MCP_ENGINE_DATABASE_USER
        fromService: {name: intel-mcp, type: web, envVarKey: MCP_ENGINE_DATABASE_USER}
      - key: MCP_ENGINE_DATABASE_PASSWORD
        fromService: {name: intel-mcp, type: web, envVarKey: MCP_ENGINE_DATABASE_PASSWORD}
      - key: MCP_ENGINE_DATABASE_SSLMODE
        fromService: {name: intel-mcp, type: web, envVarKey: MCP_ENGINE_DATABASE_SSLMODE}
