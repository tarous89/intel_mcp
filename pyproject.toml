[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-mcp"
version = "0.1.0"
description = "TrialAgents Intel MCP service"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.12,<3",
  "uvicorn>=0.31,<1",
  "openpyxl>=3.1.5,<4",
  "lxml>=5,<7",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
intel-mcp = "intel_mcp.bootstrap:main"
intel-max-worker = "intel_mcp.max_agent_execution:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
