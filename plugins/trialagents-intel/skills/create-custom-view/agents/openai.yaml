interface:
  display_name: "Create a custom view"
  short_description: "Save charts, comparisons and reusable custom views"
  default_prompt: "Use $create-custom-view for my TrialAgents research."
dependencies:
  tools:
    - type: "mcp"
      value: "trialagents-research"
      description: "Authorized TrialAgents research tools"
      transport: "streamable_http"
      url: "https://mcp.trialagents.com/research/mcp"
policy:
  allow_implicit_invocation: true
